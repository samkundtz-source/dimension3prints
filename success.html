<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Order Confirmed — Cities3ds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000000;
      --text: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.70);
      --text-muted: rgba(255, 255, 255, 0.50);
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.20);
      --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
      overflow: hidden;
      position: relative;
    }
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: containerIn 0.7s var(--ease-out) both;
    }
    @keyframes containerIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .checkmark {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 36px;
      animation: checkmarkPop 0.8s var(--ease-spring) 0.15s both;
    }
    @keyframes checkmarkPop {
      0%   { transform: scale(0); opacity: 0; }
      50%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .checkmark svg {
      color: #000;
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: drawCheck 0.6s var(--ease-out) 0.6s both;
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
    h1 {
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: var(--text);
      animation: textIn 0.6s var(--ease-out) 0.35s both;
    }
    .subtitle {
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 44px;
      line-height: 1.5;
      letter-spacing: -0.01em;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
      animation: textIn 0.6s var(--ease-out) 0.45s both;
    }
    @keyframes textIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .info-box {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 28px;
      text-align: left;
      margin-bottom: 36px;
      animation: textIn 0.6s var(--ease-out) 0.55s both;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-muted); letter-spacing: -0.005em; }
    .info-value { color: var(--text); font-weight: 600; letter-spacing: -0.005em; }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: -0.01em;
      transition:
        transform 0.28s var(--ease-spring),
        background 0.18s ease;
      animation: textIn 0.6s var(--ease-out) 0.65s both;
    }
    .btn-home.secondary {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid var(--border-strong);
    }
    .btn-home svg { transition: transform 0.28s var(--ease-spring); }
    .btn-home:hover {
      transform: translateY(-1px);
      background: #F0F0F0;
    }
    .btn-home.secondary:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .btn-home:hover svg { transform: translateX(-3px); }
    .btn-home:active { transform: translateY(0) scale(0.97); transition-duration: 0.1s; }
    .btn-stack { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="checkmark">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Order Confirmed.</h1>
    <p class="subtitle">
      Your custom 3D map model is being prepared for printing.
      You'll receive a shipping confirmation once it's on its way.
    </p>
    <div class="info-box">
      <div class="info-row" id="order-id-row" style="display:none">
        <span class="info-label">Order Number</span>
        <span class="info-value" id="order-id-val" style="font-size:14px;letter-spacing:0.04em;font-family:'SF Mono','Consolas',monospace">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Status</span>
        <span class="info-value">Processing</span>
      </div>
      <div class="info-row">
        <span class="info-label">Estimated Production</span>
        <span class="info-value">2–4 business days</span>
      </div>
      <div class="info-row">
        <span class="info-label">Confirmation</span>
        <span class="info-value">Sent to your email</span>
      </div>
    </div>
    <div class="btn-stack">
      <a href="/" class="btn-home secondary" id="view-generator-btn" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        View Your Order in Generator
      </a>
      <a href="/" class="btn-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Create Another Model
      </a>
    </div>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) return;
      try {
        const resp = await fetch('/api/order-info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId }),
        });
        const data = await resp.json();
        if (data.orderId) {
          document.getElementById('order-id-val').textContent = data.orderId;
          document.getElementById('order-id-row').style.display = '';
        }
        if (data.lat && data.lng) {
          const p = new URLSearchParams({
            lat:               data.lat,
            lng:               data.lng,
            radius:            data.radius            ?? 1,
            scale:             data.verticalScale      ?? 3,
            rotation:          data.rotation           ?? 0,
            shape:             data.shape              || 'hexagon',
            terrainRelief:     data.terrainRelief      ?? false,
            detailedBuildings: data.detailedBuildings  ?? false,
            roadElevation:     data.roadElevation      ?? false,
          });
          if (data.orderId) p.set('orderId', data.orderId);
          const btn = document.getElementById('view-generator-btn');
          btn.href = '/app.html?' + p.toString();
          btn.style.display = '';
        }
      } catch {}
    })();
  </script>
</body>
</html>
